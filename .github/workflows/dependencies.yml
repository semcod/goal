name: Dependency Update Check

on:
  schedule:
    - cron: "19 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install committed dependency versions
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --python 3.12
      - name: Audit registry dependencies from the lockfile
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path("integration/internal-dependencies.json").read_text())
          # The current repository is an editable source, not its own registry dependency.
          catalog["packages"] = [p for p in catalog["packages"] if p["name"] != "goal"]
          Path(os.environ["RUNNER_TEMP"], "goal-external-dependencies.json").write_text(json.dumps(catalog))
          PYTHON
          uv run --no-sync python -m goal dependencies \
            --catalog "$RUNNER_TEMP/goal-external-dependencies.json" \
            --check > dependency-freshness.json
      - name: Retain freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goal-dependency-freshness
          path: dependency-freshness.json
          if-no-files-found: ignore
